<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="200" rx="16" fill="#0d111b"/>
  <circle cx="200" cy="100" r="70" fill="url(#glowGrad)" opacity="0.08" filter="blur(20px)"/>

  <!-- Centered Minimalist Billing Icon -->
  <g transform="translate(160, 50)">
    <!-- Invoice Receipt Document -->
    <path d="M10 10 H70 V75 L60 68 L50 75 L40 68 L30 75 L20 68 L10 75 V10 Z" stroke="url(#accentGrad)" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Receipt Lines -->
    <line x1="20" y1="25" x2="60" y2="25" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="38" x2="50" y2="38" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="50" x2="40" y2="50" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Lightning Bolt (Utility) overlay -->
    <path d="M65 -5 L45 35 H65 L45 75" stroke="#06b6d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <defs>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="100" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
</svg>
